<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HEARTLESS</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:#fff;
    font-family:Arial, Helvetica, sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.container{
    max-width:500px;
    padding:20px;
}

.cover{
    width:100%;
    max-width:350px;
    border-radius:20px;
    box-shadow:0 0 30px rgba(255,255,255,.15);
    margin-bottom:30px;
}

h1{
    font-size:3rem;
    letter-spacing:2px;
    margin-bottom:15px;
}

p{
    font-size:1.2rem;
    margin-bottom:30px;
    opacity:.9;
}

.btn{
    display:inline-block;
    background:#fff;
    color:#000;
    text-decoration:none;
    padding:15px 35px;
    border-radius:999px;
    font-weight:bold;
    transition:.3s;
}

.btn:hover{
    transform:scale(1.05);
}
</style>
</head>
<body>

<div class="container">

    <img src="cover.jpg" alt="HEARTLESS Cover" class="cover">

    <h1>HEARTLESS</h1>

    <p>THE ALBUM IS ON THE WAY</p>

    <a class="btn" href="https://instagram.com/TUOUSERNAME" target="_blank">
        FOLLOW ON INSTAGRAM
    </a>

</div>

</body>
</html>
